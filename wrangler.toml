# Cloudflare Pages project (D7, D35). Deploy: see docs/DEPLOY.md. Secrets (API keys) are set
# with `wrangler pages secret put`, never here.
name = "tournament-platform"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[vars]
AI_PHOTO_ENABLED = "true"
AI_PROVIDER = "gemini"
RATE_LIMIT_PER_IP_PER_HOUR = "10"
DAILY_REQUEST_CAP = "500"

[[d1_databases]]
binding = "RATE_LIMIT_DB"
database_name = "tournament-rate-limits"
# Replace with the id printed by `npx wrangler d1 create tournament-rate-limits`.
database_id = "1835ffd5-3055-4124-a868-adcd6902824e"
migrations_dir = "migrations"
